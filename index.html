<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Oramemory · Doctor Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f7fa;--surface:#ffffff;--border:#e4e9f0;--border2:#cfd9e3;
  --text:#17222e;--text2:#4e6072;--text3:#8495a6;
  --accent:#1e6fa8;--accent-hi:#175c8e;--accent-weak:#e9f2f9;--accent-bd:#c6dcee;
  --red:#c23b34;--red-weak:#fbeceb;--red-bd:#eec7c4;
  --amber:#95641b;--amber-weak:#fcf5e6;--amber-bd:#eddfb9;
  --green:#27754d;--green-weak:#e9f4ee;--green-bd:#c3e0d0;
  --violet:#5b4fa8;--violet-weak:#efedf9;--violet-bd:#d9d5f0;
  --r:10px;--sh:0 1px 2px rgba(23,34,46,.05),0 1px 4px rgba(23,34,46,.05);
  --sh2:0 10px 34px rgba(23,34,46,.16);
}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.ic{flex:none;display:inline-block;vertical-align:-3px}

/* Shell */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:250px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent-weak);border:1px solid var(--accent-bd);display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:15px}
.brand-name{font-weight:700;letter-spacing:.06em;font-size:14px}
.brand-sub{font-size:11px;color:var(--text3);margin-top:1px}
.side-nav{flex:1;overflow-y:auto;padding:6px 10px 10px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;color:var(--text2);font-weight:500;font-size:13.5px}
.nav-item:hover{background:#f2f6fa;color:var(--text)}
.nav-item.active{background:var(--accent-weak);color:var(--accent);font-weight:600}
.nav-item .ic{color:var(--text3)}
.nav-item.active .ic{color:var(--accent)}
.nav-n{margin-left:auto;font-size:11px;background:var(--red-weak);color:var(--red);font-weight:700;border-radius:9px;padding:0 6px;min-width:18px;height:18px;display:inline-grid;place-items:center}
.side-user{border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:#e8eef5;color:#3f5871;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar.lg{width:52px;height:52px;font-size:17px;border-radius:13px}
.avatar.doc{background:#1d2b3a;color:#fff}
.side-user .who{min-width:0}
.side-user .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .rl{font-size:11.5px;color:var(--text3)}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:10px 26px}
.tb-when{font-size:12.5px;color:var(--text2)}
.tb-when b{color:var(--text);font-weight:600}
.tb-spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:#f7fafc;border-radius:8px;padding:7px 11px;color:var(--text3);font-size:13px;min-width:250px}
.searchbox:hover{border-color:var(--border2)}
.searchbox kbd{margin-left:auto;font:11px Inter;color:var(--text3);border:1px solid var(--border);border-radius:5px;padding:1px 5px;background:#fff}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;color:var(--text2);position:relative}
.icon-btn:hover{background:#f0f4f8;color:var(--text)}
.bell-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}
.view{padding:22px 26px 48px;max-width:1280px;width:100%;margin:0 auto}

/* Common */
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.page-sub{color:var(--text2);font-size:13.5px;margin-top:3px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;border:1px solid transparent;transition:background .12s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hi)}
.btn.ghost{background:var(--surface);border-color:var(--border2);color:var(--text)}
.btn.ghost:hover{background:#f4f7fa}
.btn.subtle{color:var(--accent);background:var(--accent-weak)}
.btn.subtle:hover{background:#dcebf6}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh)}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:13.5px;font-weight:700}
.panel-head .p-sub{font-size:12px;color:var(--text3)}
.panel-head .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.count-pill{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center}
.count-pill.red{background:var(--red)}
.panel-body{padding:14px 16px}
.panel-foot{padding:10px 16px;border-top:1px solid var(--border)}
.link-btn{color:var(--accent);font-weight:600;font-size:13px}
.link-btn:hover{text-decoration:underline}
.note{font-size:12.5px;color:var(--text2)}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--amber-weak);border:1px solid var(--amber-bd);border-radius:8px;padding:10px 12px;font-size:13px;color:#6d4c12}
.callout.red{background:var(--red-weak);border-color:var(--red-bd);color:#7c2d28}
.callout.blue{background:var(--accent-weak);border-color:var(--accent-bd);color:var(--accent-hi)}
.callout.violet{background:var(--violet-weak);border-color:var(--violet-bd);color:var(--violet)}
.empty{padding:26px;text-align:center;color:var(--text3);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;white-space:nowrap}
.tag.src-clin{background:var(--green-weak);color:var(--green);border:1px solid var(--green-bd)}
.tag.src-care{background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent-bd)}
.tag.src-fam{background:#f0f2f5;color:var(--text2);border:1px solid var(--border)}
.tag.src-app{background:var(--violet-weak);color:var(--violet);border:1px solid var(--violet-bd)}
.tag.src-ai{background:var(--violet-weak);color:var(--violet);border:1px dashed var(--violet-bd)}
.tag.f-rec{background:var(--green-weak);color:var(--green);border:1px solid var(--green-bd)}
.tag.f-sum{background:var(--accent-weak);color:var(--accent);border:1px solid var(--accent-bd)}
.tag.f-int{background:var(--violet-weak);color:var(--violet);border:1px solid var(--violet-bd)}
.tag.f-unk{background:#f0f2f5;color:var(--text2);border:1px dashed var(--border2)}
.tag.pending{background:var(--amber-weak);color:var(--amber);border:1px solid var(--amber-bd)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-up{color:#52657a;background:#eef2f6}
.b-new{color:var(--red);background:var(--red-weak)}
.b-await{color:var(--amber);background:var(--amber-weak)}
.b-under{color:var(--violet);background:var(--violet-weak)}
.b-fu{color:#18608f;background:#e2edf7}
.b-done{color:var(--green);background:var(--green-weak)}
.b-arch{color:var(--text3);background:#f0f2f5}
.b-due{color:var(--accent);background:var(--accent-weak)}

/* Stat cards */
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);transition:box-shadow .12s,transform .12s}
.stat:hover{box-shadow:0 4px 14px rgba(23,34,46,.09);transform:translateY(-1px)}
.stat .lbl{font-size:12px;font-weight:600;color:var(--text2);letter-spacing:.04em;text-transform:uppercase}
.stat .num{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 1px}
.stat .sub{font-size:12px;color:var(--text3)}
.stat .sub b{color:var(--red);font-weight:600}
.grid-2{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
.mb14{margin-bottom:14px}

/* Tables */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);font-weight:600;text-align:left;padding:9px 14px;background:#fafcfe;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s}
.tbl tbody tr:hover{background:#f7fafc}
tr.row-click{cursor:pointer}
.cell-res{display:flex;align-items:center;gap:9px;font-weight:600;color:var(--text)}
.cell-res .sub{display:block;font-size:11px;color:var(--text3);font-weight:500}
.tcell-time{font-variant-numeric:tabular-nums;color:var(--text2);font-weight:600;white-space:nowrap}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.sel,.input{border:1px solid var(--border2);border-radius:8px;background:#fff;padding:7px 10px;font:13px Inter;color:var(--text)}
.input{min-width:180px}
.input::placeholder{color:var(--text3)}
.flabel{font-size:12px;color:var(--text3);font-weight:600}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 16px;overflow-x:auto}
.tab{padding:11px 13px;font-weight:600;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .n{font-size:11px;background:#eef2f6;color:var(--text2);border-radius:9px;padding:0 6px;min-width:18px;height:18px;display:inline-grid;place-items:center}
.tab.active .n{background:var(--accent-weak);color:var(--accent)}

/* Profile */
.prof-head{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px;flex-wrap:wrap}
.prof-head .nm{font-size:19px;font-weight:700}
.prof-head .meta{color:var(--text2);font-size:13px;margin-top:2px}
.prof-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.kv-list .kv-row{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv-list .kv-row:last-child{border-bottom:none}
.kv-list .k{color:var(--text3);width:150px;flex:none}
.mini-li{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.mini-li:last-child{border-bottom:none}
.chip-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.chip{border:1px solid var(--border2);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:600;color:var(--text2)}
.chip.on{background:var(--accent-weak);border-color:var(--accent-bd);color:var(--accent)}

/* Timeline */
.tl{position:relative;padding:4px 0 4px 24px}
.tl:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:var(--border)}
.tl-day{position:relative;margin:16px 0 8px;font-weight:700;font-size:13px}
.tl-day:first-child{margin-top:4px}
.tl-day .tld-sub{font-weight:500;color:var(--text3);font-size:11.5px;margin-left:8px}
.tl-ev{position:relative;display:flex;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh)}
.tl-ev:before{content:"";position:absolute;left:-20px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--text3);border:2px solid #fff;box-sizing:content-box;margin-left:-1px}
.tl-ev.unrev:before{background:var(--amber)}
.tl-ev.open{border-color:var(--accent-bd)}
.tl-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.tl-main{flex:1;min-width:0}
.tl-title{font-weight:600;font-size:13.5px}
.tl-meta{font-size:12px;color:var(--text3);margin-top:1px}
.tl-detail{display:none;margin-top:9px;padding-top:9px;border-top:1px dashed var(--border);font-size:13px;color:var(--text2)}
.tl-ev.open .tl-detail{display:block}
.tl-gap{position:relative;padding:7px 12px;margin-bottom:8px;font-size:12px;color:var(--text3);border:1px dashed var(--border);border-radius:10px;background:#fafcfe}
.tl-gap:before{content:"";position:absolute;left:-20px;top:12px;width:8px;height:8px;border-radius:50%;background:#e4e9f0;border:2px solid #fff;box-sizing:content-box;margin-left:-1px}

/* Dots */
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dot7{width:12px;height:12px;border-radius:4px;background:#e9edf2;box-shadow:inset 0 0 0 1px rgba(23,34,46,.06)}
.dot7.ok{background:var(--green-weak);box-shadow:inset 0 0 0 1px var(--green-bd)}
.dot7.part{background:var(--amber-weak);box-shadow:inset 0 0 0 1px var(--amber-bd)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--text3);align-items:center}

/* Care situation */
details.sit{border-bottom:1px solid var(--border)}
details.sit:last-of-type{border-bottom:none}
details.sit summary{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;font-size:13.5px;list-style:none}
details.sit summary::-webkit-details-marker{display:none}
details.sit summary:hover{background:#f7fafc}
details.sit .lbl{font-weight:600;width:190px;flex:none;display:flex;gap:8px;align-items:center}
details.sit .sum{color:var(--text2);flex:1;font-size:12.5px}
details.sit .sit-body{padding:2px 16px 14px 216px;font-size:12.5px;color:var(--text2)}
@media(max-width:900px){details.sit .lbl{width:auto}details.sit .sum{display:none}details.sit .sit-body{padding-left:16px}}

/* Change cards */
.chg{border:1px solid var(--border);border-radius:10px;background:#fff;box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px}
.chg h4{font-size:13.5px;margin-bottom:8px}
.chg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px;font-size:12.5px}
.chg-grid .gk{color:var(--text3);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:2px}

/* Review modal */
.rsec{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fbfcfe}
.rsec h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:6px}
.f-row{margin-bottom:13px}
.f-row label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:5px}
.f-row .input,.f-row .sel,.f-row textarea{width:100%}
textarea.input{resize:vertical;min-height:80px;font:13px Inter}
.f-err{color:var(--red);font-size:12px;margin-top:5px;display:none}
.f-err.show{display:block}
.actbox{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px}
.actbox-head{display:flex;align-items:center;gap:10px;padding:11px 14px;font-weight:600;font-size:13px;background:#fff}
.actbox-head .ic{color:var(--accent)}
.actbox-head .btn{margin-left:auto}
.actbox-body{display:none;padding:4px 14px 14px;background:#fbfcfe;border-top:1px solid var(--border)}
.actbox.open .actbox-body{display:block}

/* Messages */
.msg-grid{display:grid;grid-template-columns:330px 1fr;gap:14px;align-items:start}
.msg-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;width:100%;text-align:left}
.msg-item:hover{background:#f7fafc}
.msg-item.active{background:var(--accent-weak)}
.msg-bubble{border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-bottom:10px;background:#fff;box-shadow:var(--sh);max-width:88%}
.msg-bubble.me{background:var(--accent-weak);border-color:var(--accent-bd);margin-left:auto}
.msg-bubble .mh{font-size:11.5px;color:var(--text3);margin-bottom:3px;display:flex;gap:8px;flex-wrap:wrap}
.msg-bubble .mh b{color:var(--text)}
@media(max-width:1000px){.msg-grid{grid-template-columns:1fr}}

/* Report paper */
.paper{background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh);padding:36px 42px;max-width:880px;margin:0 auto}
.paper h2{font-size:17px;margin-bottom:2px}
.paper h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:26px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--accent-weak)}
.paper .prule{color:var(--text3);font-size:12px}
.paper .pline{display:flex;gap:8px;font-size:13px;padding:5px 0;align-items:baseline}
.paper .pline .pk{width:180px;flex:none;color:var(--text3);font-size:12px}
.paper .pfoot{margin-top:30px;padding-top:14px;border-top:1px solid var(--border);font-size:11.5px;color:var(--text3)}
.psec-card{border:1px solid var(--border);border-radius:9px;padding:11px 13px;margin-bottom:9px;background:#fbfcfe}
@media print{
 body *{visibility:hidden!important}
 #report-print,#report-print *{visibility:visible!important}
 #report-print{position:absolute;left:0;top:0;width:100%;max-width:none;border:none;box-shadow:none;padding:0}
}

/* Notifications */
.drop{position:absolute;top:46px;right:0;width:390px;max-width:92vw;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh2);z-index:60;overflow:hidden}
.drop-head{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.drop-head b{font-size:13px}
.drop-head button{margin-left:auto;font-size:12px;color:var(--accent);font-weight:600}
.drop-sec{padding:8px 14px 4px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);display:flex;gap:7px;align-items:center}
.drop-sec.u{color:var(--red)}.drop-sec.a{color:var(--amber)}.drop-sec.i{color:var(--text3)}
.drop-item{padding:9px 14px;border-bottom:1px solid var(--border);font-size:12.5px}
.drop-item b{display:block;font-size:12.5px}
.drop-item .m{color:var(--text3);font-size:11.5px;margin-top:1px}

/* Command palette */
.pal-overlay{position:fixed;inset:0;background:rgba(15,26,38,.44);z-index:110;display:flex;justify-content:center;padding-top:11vh}
.pal{width:100%;max-width:560px;height:fit-content;background:var(--surface);border-radius:14px;box-shadow:var(--sh2);overflow:hidden;animation:pop .13s ease}
.pal-input{width:100%;border:none;outline:none;padding:16px 18px;font:15px Inter;border-bottom:1px solid var(--border)}
.pal-list{max-height:46vh;overflow-y:auto;padding:6px}
.pal-group{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:8px 12px 3px}
.pal-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13.5px}
.pal-item .sub{color:var(--text3);font-size:12px;margin-left:auto;white-space:nowrap}
.pal-item.sel,.pal-item:hover{background:var(--accent-weak)}
.pal-foot{border-top:1px solid var(--border);padding:8px 14px;font-size:11px;color:var(--text3);display:flex;gap:14px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(15,26,38,.44);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--sh2);width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;animation:pop .14s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 12px}
.m-head h3{font-size:16px;font-weight:700}
.m-head .m-sub{font-size:12.5px;color:var(--text3);margin-top:2px}
.m-body{padding:4px 20px 16px;overflow-y:auto}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.m-foot .left{margin-right:auto;display:flex;gap:8px}

/* Toasts */
.toast-wrap{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{background:#1d2b3a;color:#eef3f8;border-radius:10px;padding:11px 14px;font-size:13px;box-shadow:var(--sh2);display:flex;gap:9px;align-items:flex-start;animation:slide .18s ease}
.toast .ic{margin-top:1px}
.toast.ok .ic{color:#7fd4a8}.toast.warn .ic{color:#f0c36d}.toast.info .ic{color:#8fc1e8}
@keyframes slide{from{transform:translateY(8px);opacity:0}}

@media (max-width:1120px){
 .sidebar{width:70px}
 .brand-name,.brand-sub,.nav-label,.side-user .who{display:none}
 .nav-item{justify-content:center;padding:11px 0}
 .brand{justify-content:center;padding:16px 0 12px}
 .side-user{justify-content:center}
 .cards4{grid-template-columns:repeat(2,1fr)}
 .grid-2{grid-template-columns:1fr}
 .searchbox{min-width:0}
 .searchbox .sb-hint{display:none}
}
@media (max-width:720px){.view{padding:16px 14px 40px}.topbar{padding:10px 14px}.tb-when{display:none}}

function queueItems(){
 const pr={New:0,"Awaiting review":1,"Under review":2,"Follow-up required":3};
 const items=[
  ...REVIEWS.filter(r=>pr[r.status]!==undefined).map(r=>({kind:"rv",k:pr[r.status],date:r.rec.d,r})),
  ...FOLLOWUPS.filter(f=>f.status==="Open").map(f=>({kind:"fu",k:4,date:f.due,f})),
 ];
 return items.sort((a,b)=>a.k-b.k||a.date-b.date);
}

function renderViewPatients(){
 const f=state.patF;
 let list=PATIENTS.filter(p=>{
  if(f.q&&!(p.name.toLowerCase().includes(f.q.toLowerCase())||p.place.toLowerCase().includes(f.q.toLowerCase())))return false;
  if(f.setting!=="all"&&p.setting!==f.setting)return false;
  if(f.pending&&!(p.changes.some(c=>!c.rev)||REVIEWS.some(r=>r.p===p.id&&["New","Awaiting review","Under review"].includes(r.status))))return false;
  if(f.follow&&!FOLLOWUPS.some(x=>x.p===p.id&&x.status==="Open"))return false;
  if(f.recent&&!EVENTS.some(e=>e.p===p.id&&e.d>=-2&&!e.rev))return false;
  return true;
 });
 document.getElementById("view-root").innerHTML=`
 <div class="page-head"><div><h1>My Patients</h1><div class="page-sub">${PATIENTS.length} patients authorized for your access. Sensitive clinical detail lives inside each profile — not in this directory.</div></div></div>

   <span class="note" style="margin-left:auto">${list.length} of ${PATIENTS.length}</span>

/* ---------- Timeline component ---------- */
function timelineHTML(pid,embedded){
 const p=patById(pid);
 let evs=evOf(pid).filter(e=>{
  if(-e.d>=state.tlRange)return false;
  if(state.tlOff.has(e.type))return false;
  if(state.tlSource!=="all"&&e.sk!==state.tlSource)return false;
  if(state.tlUnrev&&e.rev)return false;
  return true;
 }).sort((a,b)=>b.d-a.d||b.t.localeCompare(a.t));
 const gap=gapDays(pid,state.tlRange);
 const gapSet=new Set(gap.filter(d=>state.tlRange<=14||true));
 const days=[...new Set(evs.map(e=>e.d))].sort((a,b)=>a-b);
 /* build day list including empty days */
 const allDays=[];for(let i=0;i<state.tlRange;i++)allDays.push(-i);
 const byDay={};evs.forEach(e=>{(byDay[e.d]=byDay[e.d]||[]).push(e);});
 const cmp=state.tlCompare?typeCounts(pid,state.tlRange):null;
 const curTypes=TKEYS.filter(k=>cmp&&(cmp.cur[k]||cmp.prev[k]));
 return `
 <div class="panel">
  <div class="panel-head"><h3>Patient Timeline${embedded?"":" — "+esc(p.name)}</h3><span class="p-sub">${esc(rangeLabel(state.tlRange))} · ${evs.length} records shown</span>
   <span class="right"><button class="btn sm subtle" data-action="ai-summary" data-id="${pid}">${ic("spark",14)} Draft period summary</button></span></div>
  <div class="filter-bar">
   <span class="flabel">Period</span>
   <select class="sel" data-role="tl-range"><option value="7" ${state.tlRange===7?"selected":""}>Last 7 days</option><option value="14" ${state.tlRange===14?"selected":""}>Last 14 days</option><option value="30" ${state.tlRange===30?"selected":""}>Last 30 days</option></select>
   <span class="flabel">Source</span>
   <select class="sel" data-role="tl-source"><option value="all">All sources</option><option value="care" ${state.tlSource==="care"?"selected":""}>Care team</option><option value="family" ${state.tlSource==="family"?"selected":""}>Family</option><option value="app" ${state.tlSource==="app"?"selected":""}>Application</option><option value="clin" ${state.tlSource==="clin"?"selected":""}>Clinician</option></select>
   <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)"><input type="checkbox" data-role="tl-unrev" ${state.tlUnrev?"checked":""}> Not yet reviewed</label>
   <label style="display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text2)"><input type="checkbox" data-role="tl-compare" ${state.tlCompare?"checked":""}> Compare with previous period</label>
  </div>
  <div class="chip-row"><span class="flabel">Record types</span>
   ${TKEYS.filter(k=>evOf(pid).some(e=>e.type===k)).map(k=>`<button class="chip ${state.tlOff.has(k)?"":"on"}" data-action="tl-chip" data-type="${k}">${TTYPES[k].l}</button>`).join("")}
   <button class="chip ${state.tlOff.size?"":"on"}" data-action="tl-chip" data-type="__none" style="margin-left:auto">${state.tlOff.size?"Reset types":"All types on"}</button>
  </div>
  ${cmp?`<div style="padding:14px 16px;border-bottom:1px solid var(--border)">
   <div style="font-weight:700;font-size:13px;margin-bottom:8px">Documented comparison — ${esc(rangeLabel(state.tlRange))} vs previous ${state.tlRange} days</div>
   <div class="table-wrap"><table class="tbl" style="min-width:480px">
    <thead><tr><th>Record type</th><th>This period</th><th>Previous</th><th>Difference</th></tr></thead>
    <tbody>${curTypes.map(k=>{const a=cmp.cur[k],b=cmp.prev[k];const d=a-b;
     return `<tr><td>${esc(TTYPES[k].l)}</td><td><b>${a}</b></td><td>${b}</td>
     <td>${d>0?`<span class="badge b-due"><span class="dot"></span>+${d} more recorded</span>`:d<0?`<span class="badge b-await"><span class="dot"></span>${d} fewer recorded</span>`:`<span class="badge b-up"><span class="dot"></span>unchanged</span>`}</td></tr>`;}).join("")}
    </tbody></table></div>
   <p class="note" style="margin-top:10px">${ic("alert",13)} <b>Missing data disclosure:</b> ${gap.length} day${gap.length===1?"":"s"} in this period contain no records at all (${gap.slice(0,5).map(d=>dShort(d)).join(", ")}${gap.length>5?"…":""}). Differences count <i>documented</i> records — fewer records do not necessarily mean less activity, fewer meals, or a change in the patient's condition.</p>
  </div>`:""}
  <div style="padding:16px">
   <div class="tl">
   ${allDays.map(d=>{
    const list=byDay[d]||[];
    let html=`<div class="tl-day">${dayLabel(d)}</div>`;
    if(p.intake!==undefined&&d<p.intake){return html+`<div class="tl-gap">Before recording started (6 Oct) — no records exist for this day.</div>`;}
    if(!list.length){return html+`<div class="tl-gap">No records this day${gapSet.has(d)?" — included in completeness disclosures":""}.</div>`;}
    html+=list.map(e=>{const tt=TTYPES[e.type];
     return `<div class="tl-ev ${e.rev?"":"unrev"}" data-action="ev-toggle" data-id="${e.id}">
      <span class="tl-ico" style="background:${tt.c};color:${tt.cc}">${ic(tt.i,15)}</span>
      <span class="tl-main">
       <div class="tl-title">${esc(e.title)}</div>
       <div class="tl-meta">${e.t} · ${esc(e.src)} &nbsp;${srcTag(e.sk)} &nbsp;${e.rev?`<span class="badge b-done"><span class="dot"></span>Reviewed</span>`:`<span class="badge b-await"><span class="dot"></span>Unreviewed</span>`}</div>
       <div class="tl-detail">
        <div>${esc(e.x)}</div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
         ${e.rev?"":`<button class="btn sm subtle" data-action="mark-ev" data-id="${e.id}">Mark as reviewed</button>`}
         <button class="btn sm ghost" data-action="ev-review" data-id="${e.id}">${ic("book",13)} Document clinical review</button>
         <button class="btn sm ghost" data-action="open-patient" data-id="${e.p}">Open patient profile</button>
        </div>
       </div>
      </span>
     </div>`;}).join("");
    return html;
   }).join("")}
   </div>
  </div>
  <div class="panel-foot"><span class="note">${ic("info",13)} Days with no entries are shown deliberately — missing documentation is disclosed, never filled in. Click any record to expand it.</span></div>
 </div>`;
}

function aiSummaryText(pid,N){
 const p=patById(pid);const evs=evOf(pid).filter(e=>-e.d<N);
 const gap=gapDays(pid,N);const tc=typeCounts(pid,N);
 const parts=TKEYS.filter(k=>tc.cur[k]).map(k=>`${TTYPES[k].l.toLowerCase()} ${tc.cur[k]}`);
 const fus=FOLLOWUPS.filter(f=>f.pid===undefined&&f.p===pid&&f.status==="Open").length;
 const qs=p.questions.filter(q=>q.status==="Open").length;
 return `Between ${dShort(-(N-1))} and ${dShort(0)}, ${evs.length} records were added for ${p.name} from ${["care","family","app","clin"].filter(s=>evs.some(e=>e.sk===s)).length} source type(s): ${parts.join(", ")||"no records"}. ${gap.length?`${gap.length} day(s) contain no records at all (${gap.map(d=>dShort(d)).join(", ")}); no information exists for those days.`:`Every day in the period has at least one record.`} ${fus||qs?`Currently open: ${fus} follow-up(s) and ${qs} question(s) awaiting professional input.`:`No follow-ups or questions are open.`} This draft is generated from recorded events only. It does not interpret clinical significance, does not explain missing records, and requires review before any clinical use.`;
}

/* ---------- Command palette ---------- */
let palItems=[],palSel=0;
function openPalette(){
 document.getElementById("pal-root").innerHTML=`<div class="pal-overlay" data-palclose="1"><div class="pal">
  <input class="pal-input" id="pal-in" placeholder="Search patients, records, pages, actions…">
  <div class="pal-list" id="pal-list"></div>
  <div class="pal-foot"><span>↑↓ navigate</span><span>↵ open</span><span>esc close</span></div></div></div>`;
 const inp=document.getElementById("pal-in");
 inp.addEventListener("input",()=>renderPal(inp.value));
 inp.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);paintPal();}
  else if(e.key==="ArrowUp"){e.preventDefault();palSel=Math.max(palSel-1,0);paintPal();}
  else if(e.key==="Enter"){e.preventDefault();const it=palItems[palSel];if(it){closePalette();it.run();}}
 });
 renderPal("");setTimeout(()=>inp.focus(),20);
}
const closePalette=()=>{document.getElementById("pal-root").innerHTML="";};
function palData(q){
 const ql=q.toLowerCase();const items=[];
 NAV.forEach(n=>items.push({g:"Navigation",l:n[2],s:"Page",i:n[1],run:()=>showView(n[0]),sc:ql&&n[2].toLowerCase().includes(ql)?2:0}));
 PATIENTS.forEach(p=>{if(!q||p.name.toLowerCase().includes(ql)||p.place.toLowerCase().includes(ql))
  items.push({g:"Patients",l:p.name,s:p.place.split("·")[0],i:"user",run:()=>{state.profileId=p.id;showView("profile");},sc:q?1:0});});
 if(q){
  EVENTS.filter(e=>-e.d<14&&e.title.toLowerCase().includes(ql)).slice(0,6).forEach(e=>{
   items.push({g:"Timeline records",l:e.title,s:patById(e.p).name+" · "+dShort(e.d),i:TTYPES[e.type].i,run:()=>{state.profileId=e.p;state.profileTab="Timeline";showView("profile");},sc:1});});
  REVIEWS.filter(r=>r.item.toLowerCase().includes(ql)&&r.status!=="Archived").forEach(r=>{
   items.push({g:"Review queue",l:r.item,s:r.status,run:()=>reviewModal(r.id),sc:2});});
 }
 items.push({g:"Actions",l:"Document the next pending review",s:queueItems()[0]?patById(queueItems()[0].r?queueItems()[0].r.p:queueItems()[0].f.p).name:"",i:"check",run:()=>{const qi=queueItems()[0];if(qi&&qi.r)reviewModal(qi.r.id);else showView("reviews");},sc:ql.includes("review")?3:0});
 items.push({g:"Actions",l:"Draft a period summary",s:"AI-assisted",i:"spark",run:()=>aiModal(state.profileId||"p1"),sc:ql.includes("summar")||ql.includes("ai")?3:0});
 return items.sort((a,b)=>b.sc-a.sc).slice(0,12);
}
function renderPal(q){
 palItems=palData(q);palSel=0;
 const groups={};palItems.forEach((it,i)=>{(groups[it.g]=groups[it.g]||[]).push({...it,i});});
 document.getElementById("pal-list").innerHTML=Object.entries(groups).map(([g,arr])=>
  `<div class="pal-group">${g}</div>`+arr.map(it=>`<button class="pal-item ${it.i===palSel?"sel":""}" data-pal="${it.i}">${ic(it.i,16)}<span>${esc(it.l)}</span><span class="sub">${esc(it.s||"")}</span></button>`).join("")).join("")
  ||`<div class="empty">No results. Try a patient name or “summary”.</div>`;
 document.querySelectorAll("[data-pal]").forEach(b=>b.addEventListener("click",()=>{const it=palItems[+b.dataset.pal];closePalette();it.run();}));
}
const paintPal=()=>document.querySelectorAll(".pal-item").forEach((el,i)=>el.classList.toggle("sel",i===palSel));

 const rows=[["Date","Time","Type","Title","Source","Source kind","Reviewed","Detail"]];
 evOf(p.id).filter(e=>-e.d<N).sort((a,b)=>b.d-a.d).forEach(e=>rows.push([dLong(e.d),e.t,TTYPES[e.type].l,e.title,e.src,SRCKIND[e.sk][0],e.rev?"Yes":"No",(e.x||"").replace(/"/g,"'")]));
 const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
 a.download=`oramemory-sources-${p.name.toLowerCase().replace(/\s/g,"-")}-${N}d.csv`;a.click();
 addAudit("Exported source records (CSV)",`${p.name} · ${N} days`);
 toast("Source records exported — includes author and timestamp for every entry.");
}

/* ---------- Global events ---------- */
document.addEventListener("click",e=>{
 if(e.target.dataset&&e.target.dataset.palclose){closePalette();return;}
 const el=e.target.closest("[data-action]");
 if(!el){if(state.notifOpen&&!e.target.closest(".drop")&&!e.target.closest("[data-action='bell-toggle']"))closeDrop();return;}
 const a=el.dataset.action,id=el.dataset.id;
 /* timeline expand */
 if(a==="ev-toggle"){if(e.target.closest("button"))return;const ev=el;ev.classList.toggle("open");return;}
 const act={
  "nav":()=>showView(el.dataset.view),
  "goto-pat":()=>{state.patF.pending=el.dataset.f==="pending";state.patF.follow=el.dataset.f==="follow";state.patF.recent=el.dataset.f==="recent";showView("patients");},
  "open-patient":()=>{closeModal();state.profileId=id;state.profileTab="Overview";state.timelineP=id;showView("profile");},
  "open-patient-tl":()=>{state.profileId=id;state.profileTab="Timeline";state.timelineP=id;showView("profile");},
  "profile-tab":()=>{state.profileTab=el.dataset.tab;if(el.dataset.tab==="Timeline"&&state.profileId)state.timelineP=state.profileId;render();},
  "open-records":()=>{const t=el.dataset.type;state.tlOff=new Set(TKEYS.filter(k=>k!==t));state.profileTab="Timeline";render();toast("Timeline filtered to this record type.","info");},
  "mark-change":()=>{const p=patById(state.profileId);p.changes[+el.dataset.i].rev=true;addAudit("Marked record-based change as reviewed",`${p.name} · ${p.changes[+el.dataset.i].w}`);toast("Change marked as reviewed — status updated on the patient's overview.");render();},
  "rev-tab":()=>{state.revTab=el.dataset.tab;render();},
  "open-review":()=>{closeModal();reviewModal(id);},
  "toggle-form":()=>{const box=document.getElementById(el.dataset.t);box.classList.toggle("open");if(el.dataset.t==="ab-doc"){const c=document.getElementById("doc-fu");if(c)c.checked=false;}},
  "open-thread":()=>{state.msgSel=id;render();},
  "open-help":helpModal,
  "bell-toggle":toggleDrop,
  "bell-clear":()=>{closeDrop();toast("Notifications marked as seen — underlying items stay open until resolved.","info");},
  "pal-open":openPalette,
  "ai-summary":()=>{closeModal();aiModal(id||state.profileId||"p1");},
  "copy-ai":()=>{try{navigator.clipboard.writeText(document.getElementById("ai-text").value);toast("Draft copied to clipboard.");}catch(err){toast("Copy not available in this environment.","warn");}},
  "mark-ev":(ev)=>{const e2=evById(id);e2.rev=true;addAudit("Marked timeline record as reviewed",`${patById(e2.p).name} · ${e2.title}`);toast("Record marked as reviewed — attributable to you.");render();},
  "ev-review":()=>eventReviewModal(id),
  "submit-ev-review":()=>{const e2=evById(id);const n=(document.getElementById("ev-note")||{value:""}).value.trim();
   if(!n){document.getElementById("ev-err").classList.add("show");return;}
   const p=patById(e2.p);e2.rev=true;
   p.reviews.unshift({d:"13 Oct 2025",by:DOCTOR.name,exam:"1 record · "+dayLabel(e2.d),sum:n,dec:[],fu:document.getElementById("ev-fu").checked?"Assigned to care team via follow-up":"—",next:"—"});
   if(document.getElementById("ev-fu").checked)FOLLOWUPS.push({id:"f"+Date.now(),p:p.id,what:"Follow-up from timeline review: "+e2.title,to:"Care team",due:3,status:"Open",from:"Clinical review"});
   addAudit("Documented clinical review from timeline",`${p.name} · ${e2.title}`);toast("Review documented and attributed to you.");closeModal();render();},
  "submit-doc":()=>{const r=REVIEWS.find(x=>x.id===id);const n=(document.getElementById("doc-note")||{value:""}).value.trim();
   if(!n){document.getElementById("doc-err").classList.add("show");return;}
   const p=patById(r.p);
   const dec=(document.getElementById("doc-dec")||{value:""}).value.trim();
   const nxt=(document.getElementById("doc-next")||{value:""}).value.trim();
   let fuTxt="—";
   if(document.getElementById("doc-fu").checked){
    const w=(document.getElementById("fu-what")||{value:"Follow-up"}).value.trim()||"Follow-up from review";
    const to=(document.getElementById("fu-to")||{value:"Care team"}).value;
    const w2=(document.getElementById("fu-when")||{value:"3"}).value;
    FOLLOWUPS.push({id:"f"+Date.now(),p:p.id,what:w,to,due:+w2,status:"Open",from:"Clinical review"});
    fuTxt=`${w} → ${to}, due in ${w2} day(s)`;
   }
   r.notes.push({by:DOCTOR.name,t:"Today "+clockStr(),x:n});
   r.status="Resolved";
   p.reviews.unshift({d:"13 Oct 2025",by:DOCTOR.name,exam:`1 source record${r.rel.length?` + ${r.rel.length} related records`:""}`,sum:n,dec:dec?[dec]:[],fu:fuTxt,next:nxt||"—"});
   addAudit("Documented clinical review & resolved item",`${p.name} · ${r.item}`);
   toast("Review documented — added to the patient's review history with your attribution.");
   closeModal();render();},
  "submit-req":()=>{const r=REVIEWS.find(x=>x.id===id);const to=(document.getElementById("req-to")||{value:"Care team"}).value;
   const n=(document.getElementById("req-note")||{value:""}).value.trim()||"Additional information requested.";
   r.status="Follow-up required";r.notes.push({by:DOCTOR.name,t:"Today "+clockStr(),x:`Information requested from ${to}: ${n}`});
   addAudit("Requested more information",`${patById(r.p).name} · ${r.item} → ${to}`);
   toast(`Request sent to ${to} — item moved to “Follow-up required”.`);closeModal();render();},
  "submit-ins":()=>{const r=REVIEWS.find(x=>x.id===id);const t2=(document.getElementById("ins-text")||{value:""}).value.trim();
   if(!t2){toast("Write the instruction text first.","warn");return;}
   const p=patById(r.p);p.instr.unshift({t:t2,by:"Dr. Roth",d:"13 Oct"});
   addAudit("Recorded authorized care instruction",`${p.name} · “${t2.slice(0,50)}${t2.length>50?"…":""}”`);
   toast("Instruction recorded with your attribution and change history. The care team is notified per workflow.");render();},
  "q-reply":()=>qReplyModal(id),
  "submit-q":()=>{const pid=el.dataset.p;const p=patById(pid);const q=p.questions.find(x=>x.id===id);
   const n=(document.getElementById("q-ans")||{value:""}).value.trim();
   if(!n){document.getElementById("q-err").classList.add("show");return;}
   q.a=`${n} — Dr. Roth, 13 Oct ${clockStr()}`;q.status="Answered";
   addAudit("Answered care-team question",`${p.name} · from ${q.by}`);
   toast("Answer recorded — the author is notified per the facility workflow.");closeModal();render();},
  "msg-send":()=>{const t=THREADS.find(x=>x.id===id);const inp=document.getElementById("msg-in");
   if(!inp.value.trim()){toast("Write a message first.","warn");return;}
   t.msgs.push({by:DOCTOR.name,role:"Consultant Geriatrician",time:"Today "+clockStr(),text:inp.value.trim()});
   t.status="Answered";addAudit("Sent patient-linked message",`${patById(t.p).name} · ${t.subj}`);
   toast("Reply sent — linked to "+patById(t.p).name+".");render();},
  "rep-print":()=>{addAudit("Exported clinical summary (PDF)",`${patById(state.repP).name} · ${state.repPeriod} days`);window.print();},
  "rep-csv":exportCSV,
 }[a];
 if(act)act();
});
document.addEventListener("change",e=>{
 const role=e.target.dataset.role;if(!role)return;
 const v=e.target.type==="checkbox"?e.target.checked:e.target.value;
 if(role==="tl-range")state.tlRange=+v;
 else if(role==="tl-source")state.tlSource=v;
 else if(role==="tl-unrev")state.tlUnrev=v;
 else if(role==="tl-compare")state.tlCompare=v;
 else if(role==="tl-p"){state.timelineP=v;}
 else if(role==="rep-p")state.repP=v;
 else if(role==="rep-period")state.repPeriod=+v;
 else if(role==="team-p")state.teamP=v;
 else if(role==="pat-setting")state.patF.setting=v;
 else if(role==="pat-pending")state.patF.pending=v;
 else if(role==="pat-follow")state.patF.follow=v;
 else if(role==="pat-recent")state.patF.recent=v;
 render();
});
document.addEventListener("input",e=>{
 const role=e.target.dataset.role;if(!role)return;
 if(role==="pat-q"){state.patF.q=e.target.value;const pos=e.target.selectionStart;render();const n=document.querySelector("[data-role='pat-q']");if(n){n.focus();n.setSelectionRange(pos,pos);}}
});
document.addEventListener("keydown",e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();return;}
 if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();openPalette();return;}
 if(e.key==="Escape"){
  if(document.querySelector(".pal-overlay"))closePalette();
  else if(document.querySelector(".overlay"))closeModal();
  else if(state.notifOpen)closeDrop();
 }
});
document.getElementById("modal-root").addEventListener("change",e=>{
 if(e.target.id==="doc-fu")document.getElementById("doc-fu-fields").style.display=e.target.checked?"block":"none";
});

/* ---------- Init ---------- */
buildShell();render();
setTimeout(()=>toast("Doctor Portal loaded — all data is illustrative. Press ⌘K / Ctrl+K to search.","info"),700);
</script>
